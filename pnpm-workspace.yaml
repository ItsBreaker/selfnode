packages:
  - packages/*
  - apps/*
  - scripts

# Dependency build scripts are blocked by default. Only allow what is
# genuinely required. See docs/DECISIONS.md ("Install scripts").
allowBuilds:
  esbuild: true
  # electron's postinstall downloads the Electron binary from Electron's GitHub
  # releases and verifies it against their published SHA-256 sums. Required.
  electron: true
  # workerd's postinstall only re-checks (or re-downloads) its platform binary,
  # which pnpm already installs as an optional dependency. Not needed; denied.
  workerd: false
  # electron-winstaller (Squirrel.Windows) is pulled in by electron-builder, but
  # we build an NSIS installer and never use Squirrel. Its script isn't needed.
  electron-winstaller: false

# Exact versions only.
savePrefix: ""
