name: Node shutdown test

# Real test of the desktop node manager's graceful shutdown: download the
# pinned, verified Nethermind + Nimbus, run them on Sepolia with the production
# command lines, stop them with the production method (a console Ctrl+C on
# Windows, SIGINT on macOS) and assert each exits cleanly: no force-kill, its
# documented exit code, and its own clean-shutdown log line.
#
# Runs only on: manual dispatch, version tags (v*), and pushes to main that
# change the node manager, its test, the client manifest or this workflow.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      [
        "apps/desktop/src/node/**",
        "apps/desktop/scripts/**",
        "apps/desktop/node-manifest.json",
        ".github/workflows/node-shutdown.yml",
      ]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch/tag at a time; a newer push cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shutdown:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @selfnode/desktop build
      - name: Run clients and stop them gracefully
        shell: bash
        env:
          RUN_SECONDS: "75"
          SHUTDOWN_TEST_DIR: ${{ runner.temp }}/selfnode-shutdown
        run: node apps/desktop/scripts/shutdown-test.mjs
      - name: Upload logs and result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-shutdown-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/selfnode-shutdown/shutdown-result.json
            ${{ runner.temp }}/selfnode-shutdown/logs/
          if-no-files-found: ignore
          retention-days: 3
