name: CI

# Typecheck, lint, format and tests. Skipped for docs-only changes (Markdown is
# formatted by the pre-commit check locally); the secret scan runs on every push
# in secrets.yml.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "arkiv/**.md"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "arkiv/**.md"]

permissions:
  contents: read

# One run per branch/tag at a time; a newer push cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (tag in the trailing comment).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
